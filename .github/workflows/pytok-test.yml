name: PyTok Browser Test

on:
  workflow_dispatch:

jobs:
  pytok-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium

      - name: Install PyTok
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/MEOMcGill/pytok.git" \
            "curl_cffi==0.16.2"

      - name: Verify installation
        run: |
          python -c "import pytok; from pytok.tiktok import PyTok; import importlib.metadata as m; print('PyTok:', m.version('pytok')); print('Path:', pytok.__file__)"
          python -c "import curl_cffi; print('curl_cffi:', curl_cffi.__version__)"

      - name: Run PyTok search
        run: |
          xvfb-run -a -s "-screen 0 1280x900x24" python test_pytok_github.py
